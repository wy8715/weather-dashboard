# ============================================================
# GitHub Actions Docker 自动部署 - City Weather Dashboard
# 触发条件：推送到 main 分支
# 流程：构建 Docker 镜像 → 导出 tar → SCP 上传 → ECS 加载并启动
# ECS 只需 Docker Engine，无需 Node.js / npm / 编译工具链
# ============================================================

name: Docker Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 构建并部署到阿里云 ECS
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ==================== 构建 Docker 镜像 ====================
      - name: 构建后端镜像
        run: |
          docker build \
            -t weather-backend:latest \
            -f server/Dockerfile \
            ./server

      - name: 构建前端镜像
        run: |
          docker build \
            -t weather-frontend:latest \
            -f Dockerfile \
            .

      # ==================== 导出镜像为 tar ====================
      - name: 导出镜像
        run: |
          docker save weather-backend:latest -o /tmp/weather-backend.tar
          docker save weather-frontend:latest -o /tmp/weather-frontend.tar
          # 压缩以减小传输体积
          gzip /tmp/weather-backend.tar
          gzip /tmp/weather-frontend.tar

      - name: 准备部署文件包
        run: |
          # 打包 docker-compose 和环境配置
          tar -czf /tmp/deploy-configs.tar.gz \
            docker-compose.yml \
            .env.docker

      # ==================== 准备 JWT 私钥 ====================
      - name: 准备和风天气 JWT 私钥
        run: |
          mkdir -p /tmp/weather-secrets
          printf '%s\n' "$QWEATHER_JWT_PRIVATE_KEY" > /tmp/weather-secrets/ed25519-private.pem
          chmod 600 /tmp/weather-secrets/ed25519-private.pem
          if [ ! -s /tmp/weather-secrets/ed25519-private.pem ]; then
            echo "[ERROR] 未配置 QWEATHER_JWT_PRIVATE_KEY Secret"
            exit 1
          fi
        env:
          QWEATHER_JWT_PRIVATE_KEY: ${{ secrets.QWEATHER_JWT_PRIVATE_KEY }}

      # ==================== SSH 配置 ====================
      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}

      - name: 添加 ECS 到 known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      # ==================== 上传到 ECS ====================
      - name: 上传镜像与配置到 ECS
        run: |
          scp /tmp/weather-backend.tar.gz \
              /tmp/weather-frontend.tar.gz \
              /tmp/deploy-configs.tar.gz \
              /tmp/weather-secrets/ed25519-private.pem \
              ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/tmp/

      # ==================== ECS 端部署 ====================
      - name: 在 ECS 上加载镜像并启动服务
        run: |
          ssh ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} << 'DEPLOY_SCRIPT'

          set -e

          APP_DIR="/var/www/weather"
          echo "[INFO] 开始 Docker 部署..."

          # 创建部署目录
          mkdir -p "${APP_DIR}"

          # 解压配置文件
          tar -xzf /tmp/deploy-configs.tar.gz -C "${APP_DIR}"

          # 安装 JWT 私钥（只读挂载给后端容器）
          mkdir -p "${APP_DIR}/secrets"
          mv /tmp/ed25519-private.pem "${APP_DIR}/secrets/ed25519-private.pem"
          chmod 600 "${APP_DIR}/secrets/ed25519-private.pem"

          # 创建生产环境 .env（敏感信息从 GitHub Secrets 注入）
          # 使用 printf 逐行写入，避免 heredoc 变量展开问题和特殊字符转义问题
          printf 'QWEATHER_JWT_CREDENTIAL_ID=%s\n' '${{ secrets.QWEATHER_JWT_CREDENTIAL_ID }}' > "${APP_DIR}/.env"
          printf 'QWEATHER_JWT_PROJECT_ID=%s\n' '${{ secrets.QWEATHER_JWT_PROJECT_ID }}' >> "${APP_DIR}/.env"
          printf 'QWEATHER_JWT_DEVELOPER_ID=%s\n' '${{ secrets.QWEATHER_JWT_DEVELOPER_ID }}' >> "${APP_DIR}/.env"
          printf 'QWEATHER_API_HOST=%s\n' '${{ secrets.QWEATHER_API_HOST }}' >> "${APP_DIR}/.env"
          printf 'QWEATHER_JWT_PRIVATE_KEY_HOST_PATH=%s\n' './secrets/ed25519-private.pem' >> "${APP_DIR}/.env"
          printf 'DEFAULT_LOCATION_ID=%s\n' '${{ secrets.DEFAULT_LOCATION_ID }}' >> "${APP_DIR}/.env"
          printf 'DEFAULT_CITY_NAME=%s\n' '${{ secrets.DEFAULT_CITY_NAME }}' >> "${APP_DIR}/.env"
          printf 'LOG_LEVEL=%s\n' 'info' >> "${APP_DIR}/.env"
          printf 'SNAPSHOT_RETENTION_DAYS=%s\n' '90' >> "${APP_DIR}/.env"
          echo "[INFO] .env 已生成："
          # 脱敏打印确认（只显示变量名，不显示值）
          grep -o '^[^=]*=' "${APP_DIR}/.env"

          # 加载 Docker 镜像
          echo "[INFO] 加载后端镜像..."
          gunzip -c /tmp/weather-backend.tar.gz | docker load

          echo "[INFO] 加载前端镜像..."
          gunzip -c /tmp/weather-frontend.tar.gz | docker load

          # 清理上传的临时文件
          rm -f /tmp/weather-backend.tar.gz \
                /tmp/weather-frontend.tar.gz \
                /tmp/deploy-configs.tar.gz

          # 切换到部署目录
          cd "${APP_DIR}"

          # 停止旧容器
          echo "[INFO] 停止旧容器..."
          docker compose down --remove-orphans 2>/dev/null || true

          # 启动新容器（.env 在当前目录下，docker-compose 默认读取）
          echo "[INFO] 启动服务..."
          docker compose up -d

          # 等待服务就绪
          sleep 5

          # 健康检查
          echo "[INFO] 检查服务状态..."
          docker compose ps

          # 如果后端异常，打印日志辅助排查
          if ! docker inspect weather-backend --format '{{.State.Health.Status}}' | grep -q 'healthy'; then
            echo "[WARN] 后端健康检查失败，最近日志："
            docker logs weather-backend --tail 30
          fi

          # 清理无用的旧镜像（保留最近 1 个版本）
          echo "[INFO] 清理旧镜像..."
          docker image prune -f --filter "until=24h"

          echo "[INFO] 部署完成！"
          DEPLOY_SCRIPT

      - name: 部署结果通知
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 部署成功，访问 http://${{ secrets.ECS_HOST }}"
          else
            echo "❌ 部署失败，请查看 Actions 日志"
          fi
