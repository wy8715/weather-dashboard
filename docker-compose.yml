# ============================================================
# Docker Compose 编排 - City Weather Dashboard
# 部署路径：/var/www/weather
# 启动命令：docker compose up -d
# ============================================================

services:
  # ---------- 前端服务（Nginx 静态资源 + API 反向代理）----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-frontend:latest
    container_name: weather-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weather-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 后端服务（Express API）----------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: weather-backend:latest
    container_name: weather-backend
    # 端口仅内部暴露，不对外开放（由 frontend 的 Nginx 代理访问）
    expose:
      - "3201"
    environment:
      # 和风天气配置
      - QWEATHER_API_KEY=${QWEATHER_API_KEY}
      - QWEATHER_API_HOST=${QWEATHER_API_HOST}
      # 服务配置
      - PORT=3201
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 城市默认值
      - DEFAULT_LOCATION_ID=${DEFAULT_LOCATION_ID:-101020100}
      - DEFAULT_CITY_NAME=${DEFAULT_CITY_NAME:-上海}
      # 数据库路径（容器内路径，数据通过 volume 持久化）
      - DB_PATH=/app/data/weather.db
      # CORS（生产环境 Nginx 同域，无需额外配置）
      - CORS_ORIGINS=
      # 快照保留天数
      - SNAPSHOT_RETENTION_DAYS=${SNAPSHOT_RETENTION_DAYS:-90}
    volumes:
      # SQLite 数据库持久化
      - weather-data:/app/data
    restart: unless-stopped
    networks:
      - weather-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3201/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ---------- 数据卷 ----------
volumes:
  weather-data:
    name: weather-data
    # 生产环境可改为 bind mount 指向宿主机目录:
    # driver_opts:
    #   type: none
    #   device: /var/www/weather/server/data
    #   o: bind

# ---------- 网络 ----------
networks:
  weather-net:
    name: weather-net
    driver: bridge
